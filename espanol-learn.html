<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Español Learn</title>
<style>
:root{--bg:#f5f2ea;--card:#fffdf8;--fg:#201d18;--mut:#7a7466;--line:#e3ddcf;--acc:#c2452d;--ok:#2e8b57;--bad:#c0392b;--warn:#d98a2b;--blue:#2a6fb0;--sh:0 1px 3px #0001,0 8px 24px #0001}
[data-theme=dark]{--bg:#17161a;--card:#212026;--fg:#ece8df;--mut:#9a9588;--line:#37353d;--acc:#ec6a4f;--ok:#4cc38a;--bad:#ef6a5b;--warn:#f0a94d;--blue:#5aa5ea;--sh:0 1px 3px #0006}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{display:flex;align-items:center;gap:14px;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--card);position:sticky;top:0;z-index:5;overflow-x:auto}
.logo{font-size:20px;color:var(--acc);white-space:nowrap}
nav{display:flex;gap:4px}
nav button{background:none;border:0;color:var(--mut);font:inherit;padding:6px 12px;border-radius:8px;cursor:pointer;white-space:nowrap}
nav button.on,nav button:hover{background:var(--bg);color:var(--fg)}
main{max-width:900px;margin:0 auto;padding:18px 16px 80px}
h1,h2,h3{margin:.2em 0 .5em}
.mut{color:var(--mut)} small{color:var(--mut)}
.btn{background:var(--acc);color:#fff;border:0;border-radius:10px;padding:9px 16px;font:inherit;font-weight:600;cursor:pointer}
.btn.ghost{background:transparent;color:var(--fg);border:1px solid var(--line)}
.btn.sm{padding:4px 10px;font-size:14px}
.btn:hover{filter:brightness(1.07)}.btn:disabled{opacity:.5;cursor:default}
input,select,textarea{font:inherit;color:var(--fg);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:7px 10px;max-width:100%}
textarea{width:100%;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:10px 0}
.row label{display:flex;gap:6px;align-items:center}
.hero{text-align:center;padding:40px 10px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px;margin-top:14px}
.tile{display:flex;flex-direction:column;gap:2px;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;cursor:pointer;color:var(--fg);font:inherit;box-shadow:var(--sh)}
.tile:hover{border-color:var(--acc)}
.tile .ic{font-size:26px}.tile b{font-size:17px}.tile em{font-style:normal;color:var(--acc);font-weight:600;font-size:14px}
.sbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.cnts b{margin-left:12px;font-size:18px}.cb{color:var(--blue)}.cr{color:var(--bad)}.cg{color:var(--ok)}
.flash{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:28px 22px;box-shadow:var(--sh);text-align:center;min-height:200px}
.flash hr{border:0;border-top:1px dashed var(--line);margin:18px 0}
.big{font-size:30px;font-weight:650;line-height:1.25}
.chip{display:inline-block;font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--mut);border:1px solid var(--line);border-radius:20px;padding:0 9px;margin-top:8px}
.hint{color:var(--warn);margin-top:8px}.alt{color:var(--mut);margin-top:4px}
.bsp{margin-top:12px;font-size:18px}.bsp small{display:block;font-size:15px}.bsp b{color:var(--acc)}
.sep{color:var(--mut)}
.actions{display:flex;gap:8px;margin-top:14px;justify-content:center;flex-wrap:wrap}
.rate{flex:1;min-width:76px;max-width:170px;background:var(--card);border:2px solid var(--line);border-radius:12px;padding:8px 6px;font:inherit;font-weight:600;cursor:pointer;color:var(--fg)}
.rate small{display:block;font-weight:400}
.r1{border-color:var(--bad)}.r2{border-color:var(--warn)}.r3{border-color:var(--ok)}.r4{border-color:var(--blue)}
.rate.sug{background:var(--fg);color:var(--bg)}.rate.sug small{color:var(--bg)}
.show{width:100%;max-width:420px;padding:13px}
.tools{display:flex;gap:6px;justify-content:center;margin-top:12px;flex-wrap:wrap}
.tools button{background:none;border:0;color:var(--mut);cursor:pointer;font:inherit;font-size:14px}.tools button:hover{color:var(--fg)}
.ti{font-size:22px;text-align:center;width:100%;max-width:420px;margin-top:16px}
.chars{display:flex;gap:4px;justify-content:center;margin-top:8px}.chars button{border:1px solid var(--line);background:var(--card);border-radius:6px;padding:2px 9px;cursor:pointer;color:var(--fg);font:inherit}
.res{margin:10px 0;padding:10px;border-radius:10px;text-align:left;display:inline-block}
.res.ok,.res.accent{background:#2e8b5722}.res.noart,.res.art,.res.near{background:#d98a2b22}.res.bad{background:#c0392b22}
u.x{color:var(--bad);text-decoration:none;background:#c0392b25}u.m{color:var(--ok);text-decoration:none;background:#2e8b5725}
.cloze{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px 20px;line-height:2.4;font-size:18px}
.gw{display:inline-block;white-space:nowrap}
input.gap{font-size:17px;padding:1px 6px;text-align:center;border:0;border-bottom:2px solid var(--mut);background:transparent;border-radius:0}
input.gap.ok{border-color:var(--ok);background:#2e8b5720}input.gap.acc{border-color:var(--warn);background:#d98a2b20}input.gap.bad{border-color:var(--bad);background:#c0392b20}
.gh{margin:0 6px 0 3px;font-size:12px}.sol{color:var(--ok);font-size:13px;margin-left:3px}
.bank{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}.bank span{background:var(--bg);border:1px solid var(--line);border-radius:20px;padding:1px 12px}
.opts{display:grid;gap:8px;margin-top:16px}
.opt{background:var(--card);border:2px solid var(--line);border-radius:12px;padding:11px;font:inherit;font-size:18px;cursor:pointer;color:var(--fg)}
.opt.ok{border-color:var(--ok);background:#2e8b5722}.opt.bad{border-color:var(--bad);background:#c0392b22}
table{width:100%;border-collapse:collapse;font-size:15px}th,td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
td.es{cursor:pointer;font-weight:600}td.es:hover{color:var(--acc)}
.box{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:10px 0}
.bars{display:flex;align-items:flex-end;gap:2px;height:90px}.bars i{flex:1;background:var(--acc);min-height:1px;border-radius:2px 2px 0 0}
.heat{display:grid;grid-template-rows:repeat(7,14px);grid-auto-flow:column;grid-auto-columns:14px;gap:3px}.heat i{background:var(--line);border-radius:3px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}@media(max-width:600px){.grid2{grid-template-columns:1fr}.big{font-size:26px}}
dialog{border:1px solid var(--line);border-radius:14px;background:var(--card);color:var(--fg);max-width:560px;width:92%;padding:18px}
dialog::backdrop{background:#0008}
.edit{display:grid;gap:8px}.edit label{display:grid;gap:2px;font-size:13px;color:var(--mut)}.edit input,.edit select{width:100%}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:9px 18px;border-radius:30px;opacity:0;transition:.25s;pointer-events:none;z-index:20;max-width:90%;text-align:center}
#toast.on{opacity:1}
.warn{color:var(--warn)}.okc{color:var(--ok)}.badc{color:var(--bad)}
/* neue Bereiche */
.guide{margin:6px 0 0;padding-left:20px}.guide li{margin:5px 0}
details.box>summary{cursor:pointer;font-weight:650;font-size:17px}
details.box[open]>summary{margin-bottom:10px}
details.inner{margin:8px 0}details.inner>summary{cursor:pointer;color:var(--blue)}
.banner{border-radius:10px;padding:10px 14px;margin:10px 0;border:1px solid var(--line);background:var(--card)}
.banner.ok{border-color:var(--ok);background:#2e8b5718}.banner.warn{border-color:var(--warn);background:#d98a2b22}.banner.stop{border-color:var(--bad);background:#c0392b18}.banner.wait{border-color:var(--blue);background:#2a6fb018}
.meter{height:8px;border-radius:6px;background:var(--line);overflow:hidden;margin-top:6px}.meter i{display:block;height:100%;background:var(--ok)}
.banner.warn .meter i{background:var(--warn)}.banner.stop .meter i{background:var(--bad)}
.badge{font-size:12px;border-radius:20px;padding:1px 10px;border:1px solid var(--line);color:var(--mut)}.badge.s{border-color:var(--warn);color:var(--warn)}.badge.i{border-color:var(--ok);color:var(--ok)}
.pkg.next{border-color:var(--acc);border-width:2px}
.tabs{display:flex;gap:6px;margin:10px 0}.tabs button{flex:1;padding:9px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--fg);font:inherit;font-weight:600;cursor:pointer}.tabs button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
#drop{border:2px dashed var(--line);border-radius:14px;padding:22px;text-align:center;color:var(--mut);cursor:pointer}#drop.over{border-color:var(--acc);color:var(--fg)}
.thumbs{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}.thumbs div{position:relative}.thumbs img{height:64px;border-radius:6px;border:1px solid var(--line);display:block}.thumbs b{position:absolute;left:3px;top:3px;background:var(--acc);color:#fff;font-size:11px;border-radius:4px;padding:0 5px}.thumbs button{position:absolute;right:2px;top:2px;border:0;background:#000a;color:#fff;border-radius:50%;width:18px;height:18px;cursor:pointer;line-height:1;font-size:12px;padding:0}
.sheets{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px;margin:8px 0}.sheets img{width:100%;border:1px solid var(--line);border-radius:6px;display:block}
progress{width:100%}
</style>
</head>
<body>
<header><b class="logo">¡Español Learn!</b><nav id="nav"></nav></header>
<main id="view"></main>
<div id="toast"></div>
<dialog id="dlg"></dialog>
<script>
'use strict';
/* ───────── Grundlagen ───────── */
const KEY='esl_trainer_v1',MIN=6e4,DAY=864e5;
const DEF={newPerDay:20,revPerDay:200,steps:[1,10],relSteps:[10],grad:1,easyIvl:4,ease:2.5,easyBonus:1.3,hardMul:1.2,leech:8,bury:true,dirs:'both',strict:false,needArt:false,autoSpeak:false,theme:'auto',learnAhead:20};
const DEFPK={preset:'claude',edge:1568,maxmb:4.5,permsg:20,cols:2,top:0,bot:0,gap:10,q:88,num:true,langs:'spa+deu',maxch:30000};
const TYPES=['nomen','verb','adjektiv','adverb','praeposition','konjunktion','pronomen','ausdruck','satz','sonstiges'];
const PM={cloze:'Lückentexte',sent:'Satzlücken',quiz:'Quiz',listen:'Diktat'};
const MODENAME={card:'Karteikarten',typing:'Tippen'};
const $=(s,e=document)=>e.querySelector(s),$$=(s,e=document)=>[...e.querySelectorAll(s)];
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4);
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const norm=s=>String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/ß/g,'ss').replace(/[¿¡?!.,;:"“”'’()]/g,'').replace(/\s+/g,' ').trim();
const ART=/^(el|la|los|las|un|una|unos|unas|der|die|das|ein|eine|el\/la)\s+/i;
const stripArt=s=>String(s).replace(ART,'');
const keyOf=s=>norm(stripArt(String(s).replace(/\(.*?\)/g,'')).replace(/\/[a-zñ-]{1,4}$/i,''));
const splitS=s=>String(s||'').split(/\s*;\s*/).map(x=>x.trim()).filter(Boolean);
const splitT=s=>String(s||'').split(/\s*,\s*/).map(x=>x.trim()).filter(Boolean);
const dk=t=>{const d=new Date(t-144e5);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const dayStart=t=>{const d=new Date((t==null?Date.now():t)-144e5);d.setHours(4,0,0,0);return d.getTime()};
const nextDay=()=>dayStart(dayStart()+26*36e5);
const dueIn=d=>dayStart(dayStart()+d*DAY+2*36e5);
const hash=s=>{let h=5381;for(let i=0;i<s.length;i++)h=((h<<5)+h+s.charCodeAt(i))|0;return(h>>>0).toString(36)};
let db;
const stFresh=ease=>({q:0,step:0,due:0,ivl:0,ef:ease,reps:0,lapses:0,bury:0});
const newSt=()=>stFresh(db.set.ease);
/* Datenbank laden/normalisieren (auch für alte Backups und Zwischenstände) */
function normalize(d){d=d&&typeof d==='object'?d:{};
 d.cards=d.cards||{};d.texts=d.texts||{};d.set={...DEF,...(d.set||{})};d.daily=d.daily||{};d.hist=d.hist||{};d.decks=d.decks&&d.decks.length?d.decks:['Standard'];d.cur=d.cur||'*';d.profile=d.profile||'';d.lastExport=d.lastExport||0;
 d.prompt={level:'A2',deck:'',interests:'',useList:true,...(d.prompt||{})};
 d.pack={win:5,budget:10,warn:80,pause:3,notify:false,log:[],blockUntil:0,jobs:{},...(d.pack||{}),cfg:{...DEFPK,...((d.pack||{}).cfg||{})}};
 const ease=d.set.ease;
 for(const c of Object.values(d.cards)){c.de=c.de||[];c.alt=c.alt||[];c.tags=c.tags||[];c.s=c.s||{};c.t=c.t||{};
  for(const m of ['s','t'])for(const k of ['f','r'])c[m][k]=c[m][k]||stFresh(ease);
  if(c.susp===undefined)c.susp=!!(c.s.f.susp||c.s.r.susp);
  if(Array.isArray(c.p))c.p={misc:c.p};c.p=c.p||{};c.created=c.created||Date.now()}
 for(const k of Object.keys(d.daily)){const x=d.daily[k];if(x&&x.n!==undefined&&!x.card)d.daily[k]={card:{n:x.n||0,r:x.r||0,x:x.x||0}}}
 return d}
function load(){let r=null;try{r=JSON.parse(localStorage.getItem(KEY))}catch(e){}db=normalize(r);db.ver=2}
function save(){try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){toast('Speichern fehlgeschlagen – bitte Zwischenstand exportieren')}}
function toast(m){const t=$('#toast');if(!t)return;t.textContent=m;t.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('on'),2800)}
/* Tageszähler pro Lernmodus */
const day=(m,w)=>{const k=dk(Date.now());const D=db.daily[k]||(w?(db.daily[k]={}):{});return D[m]||(w?(D[m]={n:0,r:0,x:0}):{n:0,r:0,x:0})};
const dayTotal=()=>{const D=db.daily[dk(Date.now())]||{};return Object.values(D).reduce((s,x)=>s+(x.n||0)+(x.r||0),0)};
const mkSt=()=>({f:newSt(),r:newSt()});
function mkCard(o){const c={id:uid(),deck:'Standard',es:'',de:[],alt:[],typ:'sonstiges',hint:'',bsp:'',bspde:'',bsp2:'',bsp2de:'',tags:[],mark:false,susp:false,p:{},created:Date.now(),...o};c.s=c.s||mkSt();c.t=c.t||mkSt();return c}
const ensureDeck=d=>{if(!db.decks.includes(d))db.decks.push(d)};
const cardIdx=()=>{const m={};for(const c of Object.values(db.cards)){const k=keyOf(c.es);m[k]=m[k]||c;for(const a of c.alt){const k2=keyOf(a);m[k2]=m[k2]||c}}return m};
const bspHTML=s=>esc(s).replace(/\{\{(.+?)\}\}/g,(m,x)=>'<b>'+x.split('|')[0]+'</b>');
const plain=s=>String(s).replace(/\{\{(.+?)\}\}/g,(m,x)=>x.split('|')[0]);
function parseGaps(s){const o=[];let last=0,m;const re=/\{\{(.+?)\}\}/g;while((m=re.exec(s))){if(m.index>last)o.push({t:s.slice(last,m.index)});const p=m[1].split('|');o.push({g:1,a:p[0].trim(),l:(p[1]||p[0]).trim()});last=re.lastIndex}if(last<s.length)o.push({t:s.slice(last)});return o}
function applyTheme(){document.documentElement.dataset.theme=db.set.theme==='auto'?(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light'):db.set.theme}
/* ───────── Edit-Distanz / Diff ───────── */
function levM(a,b){const m=a.length,n=b.length,d=Array.from({length:m+1},(_,i)=>{const r=new Array(n+1).fill(0);r[0]=i;return r});for(let j=1;j<=n;j++)d[0][j]=j;for(let i=1;i<=m;i++)for(let j=1;j<=n;j++)d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));return d}
const levD=(a,b)=>{const d=levM(a,b);return d[a.length][b.length]};
function diffHTML(a,b){const al=a.toLowerCase(),bl=b.toLowerCase(),d=levM(al,bl);let i=a.length,j=b.length;const U=[],T=[];
 while(i>0||j>0){if(i>0&&j>0&&d[i][j]===d[i-1][j-1]+(al[i-1]===bl[j-1]?0:1)){const s=al[i-1]===bl[j-1];U.push(s?esc(a[i-1]):'<u class=x>'+esc(a[i-1])+'</u>');T.push(s?esc(b[j-1]):'<u class=m>'+esc(b[j-1])+'</u>');i--;j--}
  else if(i>0&&d[i][j]===d[i-1][j]+1){U.push('<u class=x>'+esc(a[i-1])+'</u>');i--}else{T.push('<u class=m>'+esc(b[j-1])+'</u>');j--}}
 return{u:U.reverse().join(''),t:T.reverse().join('')}}
/* ───────── Spaced Repetition (SM-2, Anki-ähnlich) ───────── */
function sched(st,r){
 const S=db.set,n={...st},now=Date.now();n.reps++;
 if(n.q===2){const i=n.ivl,h=Math.max(i+1,Math.round(i*S.hardMul)),g=Math.max(h+1,Math.round(i*n.ef)),e=Math.max(g+1,Math.round(i*n.ef*S.easyBonus));
  if(r===1){n.lapses++;n.ef=Math.max(1.3,n.ef-.2);n.ivl=1;if(S.relSteps.length){n.q=3;n.step=0;n.due=now+S.relSteps[0]*MIN}else n.due=dueIn(1)}
  else{n.ivl=Math.min(36500,[0,0,h,g,e][r]);if(r===2)n.ef=Math.max(1.3,n.ef-.15);if(r===4)n.ef+=.15;n.due=dueIn(n.ivl)}
  return n}
 const steps=n.q===3?S.relSteps:S.steps;if(n.q===0){n.q=1;n.step=0}
 const grad=easy=>{const was=n.q===3;n.q=2;n.step=0;n.ivl=was?Math.max(1,n.ivl):(easy?S.easyIvl:S.grad);n.due=dueIn(n.ivl)};
 const L=steps.length;
 if(!L)grad(r===4);
 else if(r===1){n.step=0;n.due=now+steps[0]*MIN}
 else if(r===2){const m=n.step===0?(L>1?(steps[0]+steps[1])/2:steps[0]*1.5):steps[Math.min(n.step,L-1)];n.due=now+m*MIN}
 else if(r===3){n.step++;if(n.step>=L)grad(false);else n.due=now+steps[n.step]*MIN}
 else grad(true);
 return n}
function ivlLabel(n){if(n.q!==2){const m=Math.max(0,Math.round((n.due-Date.now())/MIN));return m<1?'<1m':m<60?m+'m':Math.round(m/60)+'h'}const d=n.ivl;return d<30?d+'d':d<365?(d/30).toFixed(1).replace('.0','')+'mo':(d/365).toFixed(1).replace('.0','')+'y'}
const dirs=()=>db.set.dirs==='both'?['f','r']:[db.set.dirs];
/* Jeder Lernmodus (card / typing) hat seinen EIGENEN Lernstand pro Karte und Richtung */
const stOf=(c,m,d)=>c[m==='card'?'s':'t'][d];
function allItems(deck,m){const o=[],D=dirs();for(const c of Object.values(db.cards)){if(c.susp||(deck!=='*'&&c.deck!==deck))continue;for(const d of D)o.push({c,d,m})}return o}
function counts(deck,m){const now=Date.now(),nd=nextDay(),D=day(m),S=db.set,lrn=[],rev=[],nw=[];
 for(const it of allItems(deck,m)){const s=stOf(it.c,m,it.d);if(s.bury>now)continue;
  if(s.q===0)nw.push(it);else if(s.q===2){if(s.due<nd)rev.push(it)}else if(s.due<=now+S.learnAhead*MIN)lrn.push(it)}
 const st=it=>stOf(it.c,m,it.d);
 nw.sort((a,b)=>a.c.created-b.c.created);lrn.sort((a,b)=>st(a).due-st(b).due);
 return{lrn,rev:shuffle(rev).slice(0,Math.max(0,S.revPerDay-D.r)),nw:nw.slice(0,Math.max(0,S.newPerDay+(D.x||0)-D.n))}}
function pickNext(deck,m){const C=counts(deck,m);
 if(C.lrn.length&&stOf(C.lrn[0].c,m,C.lrn[0].d).due<=Date.now())return C.lrn[0];

function parseImport(txt,defDeck){const out={cards:[],texts:[],warn:[]};let deck=defDeck||'Standard',cur=null,last=null,tn=0;

  if(cur.k==='KARTE'){if(!f.ES||!f.DE)out.warn.push(`Zeile ${cur.line}: Karte ohne ES/DE übersprungen`);else{let typ=(f.TYP||'').toLowerCase().replace('ä','ae').trim();if(!TYPES.includes(typ)){if(f.TYP)out.warn.push(`Zeile ${cur.line}: unbekannter Typ „${f.TYP}“ → sonstiges`);typ='sonstiges'}
   out.cards.push({deck:cur.deck,es:f.ES.trim(),de:splitS(f.DE),alt:splitS(f.ALT),typ,hint:f.HINWEIS||'',bsp:f.BSP||'',bspde:f.BSP_DE||'',bsp2:f.BSP2||'',bsp2de:f.BSP2_DE||'',tags:splitT(f.TAGS),line:cur.line})}}
  else{if(!f.ES)out.warn.push(`Zeile ${cur.line}: Text ohne ES übersprungen`);else{tn++;out.texts.push({deck:cur.deck,title:f.TITEL||('Text '+tn),level:f.NIVEAU||'',es:f.ES,de:f.DE||''})}}cur=null};
 let ln=0;for(const raw of txt.replace(/^﻿/,'').replace(/\r/g,'').split('\n')){ln++;const line=raw.trim();if(!line||line.startsWith('```'))continue;
  if(/^#\s*DECK\s*:/i.test(line)){flush();deck=line.split(':').slice(1).join(':').trim()||deck;continue}
  if(line.startsWith('#'))continue;
  const mh=line.match(/^=+\s*(KARTE|TEXT)\s*=+$/i);if(mh){flush();cur={k:mh[1].toUpperCase(),deck,f:{},line:ln};last=null;continue}
  const mk=line.match(/^([A-Za-zÄÖÜäöü_0-9]{2,10})\s*:\s*(.*)$/);
  if(cur&&mk&&KNOWN.includes(mk[1].toUpperCase())){last=mk[1].toUpperCase();cur.f[last]=mk[2].trim();continue}
  if(cur&&last)cur.f[last]+=' '+line;else out.warn.push(`Zeile ${ln}: nicht zuordenbar (übersprungen)`)}
 flush();return out}

  const lh=new DataView(new ArrayBuffer(30));lh.setUint32(0,0x04034b50,true);lh.setUint16(4,20,true);lh.setUint16(6,0x0800,true);lh.setUint16(12,0x21,true);lh.setUint32(14,crc,true);lh.setUint32(18,sz,true);lh.setUint32(22,sz,true);lh.setUint16(26,nm.length,true);
  parts.push(lh.buffer,nm,f.data);
  const ch=new DataView(new ArrayBuffer(46));ch.setUint32(0,0x02014b50,true);ch.setUint16(4,20,true);ch.setUint16(6,20,true);ch.setUint16(8,0x0800,true);ch.setUint16(14,0x21,true);ch.setUint32(16,crc,true);ch.setUint32(20,sz,true);ch.setUint32(24,sz,true);ch.setUint16(28,nm.length,true);ch.setUint32(42,off,true);
  cen.push(ch.buffer,nm);off+=30+nm.length+sz}
 const cs=cen.reduce((s,p)=>s+(p.byteLength!==undefined?p.byteLength:p.length),0),e=new DataView(new ArrayBuffer(22));e.setUint32(0,0x06054b50,true);e.setUint16(8,files.length,true);e.setUint16(10,files.length,true);e.setUint32(12,cs,true);e.setUint32(16,off,true);
 return new Blob([...parts,...cen,e.buffer],{type:'application/zip'})}

   for(const f of ['hint','bsp','bspde','bsp2','bsp2de'])if(!ex[f]&&c[f])ex[f]=c[f];upd++}}
 const T={};Object.values(db.texts).forEach(x=>T[x.deck+'|'+norm(x.title)]=x);let tn=0;
 for(const x of Object.values(inc.texts)){const k=x.deck+'|'+norm(x.title);if(T[k]){T[k].best=Math.max(T[k].best||0,x.best||0)}else{const id=db.texts[x.id]?uid():x.id;db.texts[id]={...x,id};T[k]=db.texts[id];ensureDeck(x.deck);tn++}}
 for(const [k,h] of Object.entries(inc.hist))if(!db.hist[k]||h.n>db.hist[k].n)db.hist[k]=h;
 for(const [k,d] of Object.entries(inc.daily)){const o=db.daily[k]||(db.daily[k]={});for(const m of Object.keys(d))if(!o[m]||(d[m].n+d[m].r)>(o[m].n+o[m].r))o[m]=d[m]}
 inc.decks.forEach(ensureDeck);Object.assign(db.pack.jobs,Object.fromEntries(Object.entries(inc.pack.jobs).filter(([k])=>!db.pack.jobs[k])));
 return{add,upd,tn}}
async function impState(){const f=$('#d_fi').files[0];if(!f){toast('Bitte zuerst eine Datei wählen');return}let j;try{j=JSON.parse(await f.text())}catch(e){toast('Keine gültige JSON-Datei');return}
 const raw=j&&j.format==='ESLEARN-STATE'?j.data:(j&&j.cards?j:null);if(!raw){toast('Das ist keine Zwischenstand-Datei');return}
 const inc=normalize(JSON.parse(JSON.stringify(raw))),mode=$('#d_mode').value,nc=Object.keys(inc.cards).length,nt=Object.keys(inc.texts).length;
 if(mode==='replace'){if(!confirm(`Alle aktuellen Daten durch den Zwischenstand ersetzen?\n\nDatei: ${nc} Karten, ${nt} Texte${j.exported?` (exportiert ${new Date(j.exported).toLocaleString('de-DE')})`:''}\nAktuell: ${Object.keys(db.cards).length} Karten`))return;
  db=inc;db.ver=2;save();applyTheme();toast(`Zwischenstand geladen: ${nc} Karten, ${nt} Texte`);go('home')}
 else{const r=mergeState(inc);save();toast(`Zusammengeführt: ${r.add} neue Karten, ${r.upd} abgeglichen, ${r.tn} neue Texte`);pData()}}
function resetAll(){if(confirm('WIRKLICH alle Karten, Texte und Fortschritt löschen?')&&confirm('Letzte Warnung – das kann nicht rückgängig gemacht werden. (Tipp: vorher einen Zwischenstand exportieren.)')){localStorage.removeItem(KEY);load();go('home')}}
function copyList(){copyText(Object.values(db.cards).map(c=>c.es).join('; '))}
/* Export für andere Apps */
let xp={fmt:'anki_basic',deck:'*'};
const EXF={
 anki_basic:['Anki – Karteikarten Spanisch → Deutsch (mit Hinweis & Beispielsatz)','txt','Anki öffnen → Datei → Importieren → diese Datei wählen. Notiztyp „Basic“ (bei deutscher Oberfläche „Einfach“), Trennzeichen „Tabulator“, „HTML in Feldern erlauben“ an. Anki 2.1.55+ erkennt Notiztyp, Deck, Tags und ID automatisch. Durch die ID-Spalte aktualisiert ein erneuter Import vorhandene Notizen, statt Duplikate zu erzeugen. Der Lernstand wird nicht übertragen: In Anki starten die Karten neu.'],
 anki_rev:['Anki – Karteikarten in beide Richtungen (nur Bedeutung)','txt','Wie oben, aber Notiztyp „Basic (and reversed card)“ („Einfach (+ umgekehrte Karte)“). Die Rückseite enthält nur die Bedeutung, damit Beispielsätze die Lösung nicht verraten.'],
 anki_cloze:['Anki – Lückentexte (Cloze) aus Beispielsätzen & Texten','txt','Notiztyp „Cloze“ („Lückentext“). Jeder Beispielsatz wird eine Lückenkarte, jeder Lückentext eine Notiz mit einer Karte pro Lücke. Die deutsche Bedeutung steht als Hinweis in der Lücke.'],
 quizlet:['Quizlet / Cram / Brainscape (Begriff ⇥ Definition)','txt','Quizlet: Erstellen → Importieren → Datei-Inhalt einfügen. „Zwischen Begriff und Definition“: Tab, „Zwischen Zeilen“: Neue Zeile.'],
 csv:['CSV für Excel, Memrise, Notion … (alle Felder)','csv','Semikolon-getrennt, UTF-8 mit BOM (Excel öffnet Umlaute korrekt). Erste Zeile = Spaltenüberschriften.'],
 esl:['ESLERN v1 TXT (zum Wiedereinlesen in diese App)','txt','Lesbares Austauschformat inklusive Lückentexten. Ohne Lernstand – dafür ist der Zwischenstand da.']};
const exCards=deck=>Object.values(db.cards).filter(c=>deck==='*'||c.deck===deck).sort((a,b)=>a.created-b.created);
const exTexts=deck=>Object.values(db.texts).filter(t=>deck==='*'||t.deck===deck);
const cell=s=>String(s==null?'':s).replace(/[\t\r\n]+/g,' ').trim();
const ntag=s=>String(s).trim().replace(/\s+/g,'_');
const ankiTags=c=>[...new Set([c.typ!=='sonstiges'?c.typ:'',...c.tags].filter(Boolean).map(ntag))].join(' ');
const clz=s=>String(s).replace(/::/g,': :').replace(/[{}]/g,'');
function eslText(deck){let o='#ESLERN v1\n';for(const d of db.decks){if(deck!=='*'&&d!==deck)continue;const C=exCards('*').filter(c=>c.deck===d),T=exTexts('*').filter(t=>t.deck===d);if(!C.length&&!T.length)continue;o+=`#DECK: ${d}\n\n`;
 for(const c of C)o+=`===KARTE===\nES: ${c.es}\nDE: ${c.de.join(' ; ')}\n`+(c.alt.length?`ALT: ${c.alt.join(' ; ')}\n`:'')+`TYP: ${c.typ}\n`+(c.hint?`HINWEIS: ${c.hint}\n`:'')+(c.bsp?`BSP: ${c.bsp}\nBSP_DE: ${c.bspde}\n`:'')+(c.bsp2?`BSP2: ${c.bsp2}\nBSP2_DE: ${c.bsp2de}\n`:'')+(c.tags.length?`TAGS: ${c.tags.join(', ')}\n`:'')+'\n';
 for(const t of T)o+=`===TEXT===\nTITEL: ${t.title}\n`+(t.level?`NIVEAU: ${t.level}\n`:'')+`ES: ${t.es}\n`+(t.de?`DE: ${t.de}\n`:'')+'\n'}return o}
function clozeRows(deck){const idx=cardIdx(),rows=[];
 for(const c of exCards(deck)){[[c.bsp,c.bspde,'1'],[c.bsp2,c.bsp2de,'2']].forEach(([s,de,n])=>{if(!s)return;const parts=sentGap(c,s);if(!parts)return;let k=0;
  const text=parts.map(p=>p.g?`{{c${++k}::${esc(clz(p.a))}${c.de[0]?'::'+esc(clz(c.de[0])):''}}}`:esc(p.t)).join('');
  rows.push([text,`${esc(de||'')}<br><small>${esc(c.es)} = ${c.de.map(esc).join('; ')}</small>`,c.deck,ankiTags(c),'eslc'+c.id+'_'+n])})}
 for(const t of exTexts(deck)){let k=0;const text=t.es.split(/\s*\/\/\s*/).map(p=>parseGaps(p).map(x=>{if(!x.g)return esc(x.t);const c=idx[keyOf(x.l)],h=c&&c.de[0]?'::'+esc(clz(c.de[0])):'';return `{{c${++k}::${esc(clz(x.a))}${h}}}`}).join('')).join('<br><br>');
  rows.push([text,esc(t.de||'').replace(/ \/\/ /g,'<br><br>'),t.deck,'esl text'+(t.level?' '+ntag(t.level):''),'eslt'+t.id])}
 return rows}
function expBuild(fmt,deck){const C=exCards(deck),H=['#separator:tab','#html:true'],tab=rows=>rows.map(r=>r.map(cell).join('\t')).join('\n');
 if(fmt==='anki_basic'){H.push('#notetype:Basic','#deck column:3','#tags column:4','#guid column:5');
  return H.join('\n')+'\n'+tab(C.map(c=>{let b=c.de.map(esc).join('; ');if(c.alt.length)b+=`<br><small>auch: ${c.alt.map(esc).join(', ')}</small>`;if(c.hint)b+=`<br><i>💡 ${esc(c.hint)}</i>`;
   for(const [x,y] of [[c.bsp,c.bspde],[c.bsp2,c.bsp2de]])if(x)b+=`<br><br>${bspHTML(x)}<br><small>${esc(y)}</small>`;return[esc(c.es),b,c.deck,ankiTags(c),'esl'+c.id]}))}
 if(fmt==='anki_rev'){H.push('#notetype:Basic (and reversed card)','#deck column:3','#tags column:4','#guid column:5');
  return H.join('\n')+'\n'+tab(C.map(c=>[esc(c.es),c.de.map(esc).join('; '),c.deck,ankiTags(c),'eslr'+c.id]))}
 if(fmt==='anki_cloze'){H.push('#notetype:Cloze','#deck column:3','#tags column:4','#guid column:5');const R=clozeRows(deck);return R.length?H.join('\n')+'\n'+tab(R):''}
 if(fmt==='quizlet')return C.map(c=>cell(c.es)+'\t'+cell(c.de.join('; '))).join('\n');
 if(fmt==='csv'){const q=s=>'"'+String(s==null?'':s).replace(/"/g,'""').replace(/\r?\n/g,' ')+'"';
  return ['Spanisch','Deutsch','Varianten','Typ','Hinweis','Beispiel','Beispiel (DE)','Beispiel 2','Beispiel 2 (DE)','Tags','Deck'].map(q).join(';')+'\n'+C.map(c=>[c.es,c.de.join('; '),c.alt.join('; '),c.typ,c.hint,plain(c.bsp),c.bspde,plain(c.bsp2),c.bsp2de,c.tags.join(', '),c.deck].map(q).join(';')).join('\n')}
 return eslText(deck)}
function xpUpd(){const t=expBuild(xp.fmt,xp.deck),L=t?t.split('\n'):[],n=exCards(xp.deck).length;
 $('#exprev').value=L.length?L.slice(0,14).join('\n')+(L.length>14?`\n… (${L.length-14} weitere Zeilen)`:''):'(Nichts zu exportieren – für dieses Format fehlen passende Daten.)';
 $('#exinfo').innerHTML=`<b>${n}</b> Karten${xp.fmt==='anki_cloze'?` · <b>${clozeRows(xp.deck).length}</b> Lückennotizen`:''}${xp.fmt==='esl'?` · <b>${exTexts(xp.deck).length}</b> Texte`:''}<p class=mut style="margin:6px 0 0">${EXF[xp.fmt][2]}</p>`;
 $('#exdl').disabled=!L.length;$('#excp').disabled=!L.length}
function xpDl(){const t=expBuild(xp.fmt,xp.deck);if(!t){toast('Nichts zu exportieren');return}const f=EXF[xp.fmt],nm=xp.fmt.replace('_','-')+'-'+(xp.deck==='*'?'alle-decks':xp.deck.replace(/[^\wäöüÄÖÜß-]+/g,'_'))+'.'+f[1];dl(nm,(f[1]==='csv'?'﻿':'')+t,f[1]==='csv'?'text/csv;charset=utf-8':'text/plain;charset=utf-8')}
function xpCp(){const t=expBuild(xp.fmt,xp.deck);if(t)copyText(t)}
function pData(){const nc=Object.keys(db.cards).length,nt=Object.keys(db.texts).length,decks=db.decks.filter(d=>Object.values(db.cards).some(c=>c.deck===d)||Object.values(db.texts).some(t=>t.deck===d));
 if(xp.deck!=='*'&&!decks.includes(xp.deck))xp.deck='*';
 view(`<h2>Daten</h2>
 <div class=box><h3 style="margin-top:0">💾 Zwischenstand – alles in einer Datei</h3>
 <p class=mut style="margin-top:0">Enthält <b>alles</b>: ${nc} Karten mit Lernstand (Karteikarten &amp; Tippen getrennt), Übungsstatistik je Modus, ${nt} Lückentexte inkl. Bestwerte, Tagesstatistik &amp; Verlauf, Einstellungen, Prompt-Einstellungen und den Fortschritt des Sendeplans. Damit kannst du auf einem anderen Gerät oder Browser genau da weitermachen, wo du aufgehört hast.</p>
 <div class=row><label>Name / Profil <input value="${esc(db.profile)}" placeholder="z. B. Anna" oninput="db.profile=this.value;save()"></label><button class=btn onclick="expState()">⬇ Zwischenstand exportieren</button><small>Letzter Export: ${db.lastExport?new Date(db.lastExport).toLocaleString('de-DE'):'noch nie'}</small></div>
 <div class=row><input type=file id=d_fi accept=".json,application/json"><label>Modus <select id=d_mode><option value=replace>Ersetzen (alles überschreiben)</option><option value=merge>Zusammenführen (Fortschritt mit mehr Wiederholungen gewinnt)</option></select></label><button class="btn ghost" onclick="impState()">⬆ Einlesen</button></div>
 <small>Akzeptiert auch Backups der älteren Versionen (Español Trainer). Deine Daten liegen sonst nur in diesem Browser – exportiere regelmäßig.</small></div>

 <div class=box><h3 style="margin-top:0">📤 Export für andere Lern-Apps</h3>
 <div class=row><label>Format <select onchange="xp.fmt=this.value;xpUpd()">${Object.entries(EXF).map(([k,v])=>`<option value=${k} ${xp.fmt===k?'selected':''}>${v[0]}</option>`).join('')}</select></label>
 <label>Deck <select onchange="xp.deck=this.value;xpUpd()"><option value="*">alle Decks</option>${decks.map(d=>`<option ${xp.deck===d?'selected':''}>${esc(d)}</option>`).join('')}</select></label></div>
 <div id=exinfo class=box style="margin:6px 0"></div>
 <textarea id=exprev rows=8 readonly></textarea>
 <div class=row><button class=btn id=exdl onclick="xpDl()">⬇ Datei herunterladen</button><button class="btn ghost" id=excp onclick="xpCp()">Kopieren</button></div></div>

 <div class=box><h3 style="margin-top:0">Weiteres</h3><div class=row><button class="btn ghost" onclick="copyList()">Wortliste kopieren (für den KI-Prompt)</button><button class="btn ghost" onclick="resetAll()" style="color:var(--bad)">Alles löschen</button></div></div>`);xpUpd()}
/* ───────── Tastatur ───────── */
document.addEventListener('keydown',e=>{if($('#dlg').open||e.ctrlKey||e.metaKey||e.altKey)return;const k=e.key,inp=/INPUT|TEXTAREA|SELECT/.test(e.target.tagName);
 if(route==='study'&&ses){
  if(inp){if(e.target.id==='ti'&&k==='Enter'){e.preventDefault();doCheck()}return}
  if(!ses.it)return;
  if(!ses.shown){if(ses.mode==='card'&&(k===' '||k==='Enter')){e.preventDefault();reveal()}}
  else if(k.length===1&&'1234'.includes(k))rate(+k);else if(k===' '||k==='Enter'){e.preventDefault();rate((ses.res&&ses.res.sug)||3)}
  if(k==='z')undo();else if(k==='e')editCard(ses.it.c.id,()=>render());else if(k==='s')susp();else if(k==='b')bury();else if(k==='m')mark();else if(k==='p')speak(ses.it.c.es)}
 else if(route==='quiz'&&qz&&!inp){const q=qz.q[qz.i];if(!q)return;if(q.ans==null&&k.length===1&&'1234'.includes(k)&&q.opts[+k-1])qPick(+k-1);else if(q.ans!=null&&k==='Enter')qNext()}
 else if(route==='text'&&e.target.classList&&e.target.classList.contains('gap')&&k==='Enter'){e.preventDefault();const g=$$('input.gap'),i=g.indexOf(e.target);if(i<g.length-1)g[i+1].focus();else checkText()}});

init();
